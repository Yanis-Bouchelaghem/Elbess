services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: elbess
      POSTGRES_PASSWORD: elbess
      POSTGRES_DB: elbess
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ mounts at /var/lib/postgresql (not .../data as in <=17)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elbess"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
